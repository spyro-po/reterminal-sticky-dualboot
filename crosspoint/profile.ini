[platformio]
; Final-link audit requires a freshly emitted map, not cached ELF side effects.
build_cache_dir =

[env:sticky]
platform_packages =
  tool-scons @ https://github.com/pioarduino/scons/releases/download/4.11.1/scons-local-4.11.1.tar.gz

; Experimental, build-only integration. Never upload this environment.
[env:sticky-dualboot-test]
extends = env:sticky
board_build.flash_size = 32MB
board_upload.flash_size = 32MB
board_upload.maximum_size = 6291456
custom_dualboot_root = ../..
board_build.partitions = ../../partitions/sticky-32m.csv
custom_sdkconfig =
  ${firmware_tuned.custom_sdkconfig}
  CONFIG_ESPTOOLPY_FLASHSIZE_32MB=y
  CONFIG_NVS_ENCRYPTION=n
  CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=n
  CONFIG_BOOTLOADER_APP_ANTI_ROLLBACK=n
  CONFIG_SECURE_BOOT=n
  CONFIG_SECURE_FLASH_ENC_ENABLED=n
build_flags =
  ${env:sticky.build_flags}
  -DCROSSPOINT_VERSION=\"2.0.0-dualboot-menu-test\"
  -DCROSSPOINT_STICKY_DUALBOOT=1
  -DCROSSPOINT_SEEEDASH_RETURN_VERIFIED=0
extra_scripts =
  pre:../../crosspoint/platformio_build.py
  ${base.extra_scripts}
  post:../../crosspoint/capture_config.py
